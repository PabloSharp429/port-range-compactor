[project]
name = "port-range-compactor"
version = "0.1.0"
description = "Compress a list of individual port numbers into the shortest possible comma-and-dash range specification."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
